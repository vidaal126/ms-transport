services:
  transport-db:
    image: postgres:16-alpine
    container_name: transport-db
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport_db
    ports:
      - "5435:5432"
    volumes:
      - transport_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport -d transport_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  transport_db_data:
